name: iPadOS CI

# Private repos get limited free macOS minutes — macOS runners are billed at
# 10x, so this runs on pushes/PRs but can also be dispatched manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.device }})
    runs-on: macos-latest
    # One universal binary: the iPad sidebar shell and the iPhone tab-bar
    # shell both ship from this repo, so test each on its own simulator.
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPad
            prefer: iPad Pro 11-inch
          - device: iPhone
            prefer: iPhone 17
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Runner images don't all carry the same simulator names — pick the
      # preferred model if it exists, else any device of the same family.
      - name: Pick an ${{ matrix.device }} simulator
        id: sim
        env:
          FAMILY: ${{ matrix.device }}
          PREFER: ${{ matrix.prefer }}
        run: |
          set -eo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; devs=json.load(sys.stdin)["devices"]; fam=os.environ["FAMILY"]; flat=[d for r,arr in devs.items() for d in arr if "iOS" in r and d["name"].startswith(fam)]; p=os.environ["PREFER"]; pref=[d for d in flat if d["name"]==p] or [d for d in flat if d["name"].startswith(p)]; d=(pref or flat or [None])[0]; print(d["udid"]+" "+d["name"] if d else "")')
          if [ -z "$SIM" ]; then
            echo "::error::no $FAMILY simulator available on this runner"
            exit 1
          fi
          echo "id=${SIM%% *}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${SIM#* }"

      # A cold simulator can take longer than XCUITest's 60s app-launch
      # timeout, failing whichever UI test runs first — boot it and wait.
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.id }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b

      # UITourTests and ScreenshotTests are manual-QA screenshot suites —
      # they interact with system dialogs (dictation, keyboard onboarding)
      # that don't exist on a fresh CI sim, so they run locally, not here.
      - name: Build and test
        run: >-
          xcodebuild
          -project FifiRecipesPad.xcodeproj
          -scheme FifiRecipesPad
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}'
          -configuration Debug
          clean test
          -only-testing:FifiRecipesPadTests
          -only-testing:FifiRecipesPadUITests/FifiRecipesPadUITests
          -parallel-testing-enabled NO
          -resultBundlePath test-results.xcresult
          CODE_SIGNING_ALLOWED=NO

      # Raw job logs and artifacts aren't always reachable, so surface the
      # failing test names and messages as annotations on the run.
      - name: Annotate failing tests
        if: failure()
        run: python3 scripts/ci-annotate-failures.py test-results.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.device }}-xcresult
          path: test-results.xcresult
          retention-days: 7
