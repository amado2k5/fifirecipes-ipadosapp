name: iPadOS CI

# Private repos get limited free macOS minutes — macOS runners are billed at
# 10x, so this runs on pushes/PRs but can also be dispatched manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Runner images don't all carry the same iPad simulator names — pick
      # whatever 11-inch Pro exists, else any iPad.
      - name: Pick an iPad simulator
        id: sim
        run: |
          set -eo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; flat=[d for r,arr in devs.items() for d in arr if "iOS" in r and d["name"].startswith("iPad")]; pref=[d for d in flat if d["name"].startswith("iPad Pro 11-inch")]; d=(pref or flat or [None])[0]; print(d["udid"]+" "+d["name"] if d else "")')
          if [ -z "$SIM" ]; then
            echo "::error::no iPad simulator available on this runner"
            exit 1
          fi
          echo "id=${SIM%% *}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${SIM#* }"

      # A cold simulator can take longer than XCUITest's 60s app-launch
      # timeout, failing whichever UI test runs first — boot it and wait.
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.id }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.id }}" -b

      # UITourTests and ScreenshotTests are manual-QA screenshot suites —
      # they interact with system dialogs (dictation, keyboard onboarding)
      # that don't exist on a fresh CI sim, so they run locally, not here.
      - name: Build and test
        run: >-
          xcodebuild
          -project FifiRecipesPad.xcodeproj
          -scheme FifiRecipesPad
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}'
          -configuration Debug
          clean test
          -only-testing:FifiRecipesPadTests
          -only-testing:FifiRecipesPadUITests/FifiRecipesPadUITests
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
